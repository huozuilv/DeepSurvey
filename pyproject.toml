[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "deepsurvey"
version = "0.1.0"
description = "DeepSurvey — Deep Multi-Agent Literature Synthesis with long-chain reasoning and knowledge graph construction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "DeepSurvey Contributors"},
]
keywords = [
    "literature-review",
    "multi-agent",
    "knowledge-graph",
    "research-synthesis",
    "academic",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
all = ["openai>=1.0.0", "anthropic>=0.30.0"]

[project.scripts]
deepsurvey = "deepsurvey.main:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/deepsurvey"
Repository = "https://github.com/YOUR_USERNAME/deepsurvey"
Issues = "https://github.com/YOUR_USERNAME/deepsurvey/issues"

[tool.setuptools.packages.find]
include = ["deepsurvey*"]
